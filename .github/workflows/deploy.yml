name: Build & Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # ESLint blocks CI on ERRORS. Warnings (currently ~82 — complexity,
        # label-has-associated-control, react-refresh, etc.) son tech-debt
        # visible pero no bloqueante. Las reglas que importan (import/no-cycle,
        # import/no-duplicates, jsx-a11y/aria-*, no-unused-vars) están como
        # error y SÍ bloquean. Documentado en eslint.config.js y CLAUDE.md.
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Dead code check (knip)
        # Falla CI si aparecen exports/files/deps muertos. Pre-commit (lint-staged)
        # no cubre esto porque knip mira el grafo completo, no archivos staged.
        # continue-on-error mientras se establece baseline; quitar tras primer
        # cleanup pass si conviene.
        continue-on-error: true
        run: npm run knip:production

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRICE_MONTHLY: ${{ secrets.VITE_STRIPE_PRICE_MONTHLY }}
          VITE_STRIPE_PRICE_ANNUAL: ${{ secrets.VITE_STRIPE_PRICE_ANNUAL }}
          VITE_STRIPE_PRICE_B2B_PER_SEAT: ${{ secrets.VITE_STRIPE_PRICE_B2B_PER_SEAT }}

      - name: Deploy to live (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: playoff-creator

      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: playoff-creator

      # Functions + rules are deployed only on push to main, not on PRs (which already
      # cover Hosting via the preview channel above). The service account in
      # FIREBASE_SERVICE_ACCOUNT must have Cloud Functions Developer +
      # Service Account User + Cloud Datastore Owner roles for these steps.
      - name: Install Firebase CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # functions/ has its own package.json with its own tsc; without this
        # step, the firebase predeploy hook (`npm --prefix functions run
        # build`) falls back to a global tsc that fails with TS5011.
        run: npm ci --prefix functions

      - name: Deploy Firestore rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Antes (pre sub-7 batch CI): rules se desplegaban a mano. Ahora se
        # despliegan en cada push a main. Mismo soft-fail pattern que functions
        # — si la SA no tiene Cloud Datastore Owner, no rompe el hosting deploy
        # pero deja warning visible.
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa-key-rules.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa-key-rules.json"
          firebase deploy --only firestore:rules --project playoff-creator --force --non-interactive
          STATUS=$?
          rm -f "$RUNNER_TEMP/sa-key-rules.json"
          if [ $STATUS -ne 0 ]; then
            echo "::warning::Firestore rules deploy failed (exit $STATUS). Grant the service account Cloud Datastore Owner. Hosting deploy is unaffected."
          fi
          exit $STATUS

      - name: Deploy Firestore indexes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Sin este step, cualquier query nuevo con .where compuesto o
        # .where + .orderBy sobre campos distintos falla en prod con
        # FAILED_PRECONDITION (no auto-deploy desde firestore.indexes.json).
        # Mismo soft-fail pattern que rules. Pasó el 2026-05-15 con
        # pendingAnalysesScoutings (sub-A.4a) tumbando aiChat + pickGetProactive
        # tras el deploy de sub-C — ver feedback_ci_firestore_indexes_not_deployed.md.
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa-key-indexes.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa-key-indexes.json"
          firebase deploy --only firestore:indexes --project playoff-creator --force --non-interactive
          STATUS=$?
          rm -f "$RUNNER_TEMP/sa-key-indexes.json"
          if [ $STATUS -ne 0 ]; then
            echo "::warning::Firestore indexes deploy failed (exit $STATUS). Grant the service account Cloud Datastore Owner. Hosting deploy is unaffected. Note: index builds take 1-3 min after deploy succeeds."
          fi
          exit $STATUS

      - name: Deploy Cloud Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Soft-fail: the FIREBASE_SERVICE_ACCOUNT secret was provisioned for
        # Hosting deploys (Firebase Hosting Admin role only). To make this
        # step succeed, grant the service account these GCP roles in the
        # Console (IAM & Admin → IAM):
        #   - Cloud Functions Developer
        #   - Service Account User
        #   - Service Usage Consumer
        # Once those are granted, the step will go from yellow warning to
        # green and functions will redeploy on every push to main. Until
        # then, the step warns loudly but doesn't block the Hosting deploy
        # (which has its own narrower scope and works today).
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa-key.json"
          firebase deploy --only functions --project playoff-creator --force --non-interactive
          STATUS=$?
          rm -f "$RUNNER_TEMP/sa-key.json"
          if [ $STATUS -ne 0 ]; then
            echo "::warning::Cloud Functions deploy failed (exit $STATUS). If this is a permissions error, grant the service account Cloud Functions Developer + Service Account User + Service Usage Consumer roles. Hosting deploy is unaffected."
          fi
          exit $STATUS

      # Limpieza periódica de preview channels (uno por PR) — Firebase Hosting
      # acumula uno por PR indefinidamente sin esta etapa. Lista todos los
      # channels excepto 'live' y borra los con más de 7 días de antigüedad.
      - name: Cleanup stale preview channels
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa-cleanup.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa-cleanup.json"
          CUTOFF=$(date -u -d '7 days ago' --iso-8601=seconds 2>/dev/null || date -u -v-7d -Iseconds)
          firebase hosting:channel:list --project playoff-creator --json 2>/dev/null \
            | node -e "
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const channels = (data?.result?.channels || []).filter(c => c.name && !c.name.endsWith('/live') && c.updateTime < '$CUTOFF');
              for (const c of channels) {
                const id = c.name.split('/').pop();
                console.log('Deleting stale channel:', id, 'last update:', c.updateTime);
                require('child_process').execSync('firebase hosting:channel:delete ' + id + ' --project playoff-creator --force', { stdio: 'inherit' });
              }
              if (channels.length === 0) console.log('No stale preview channels to clean.');
            " || echo "::warning::Preview channel cleanup encountered an error (non-fatal)."
          rm -f "$RUNNER_TEMP/sa-cleanup.json"
