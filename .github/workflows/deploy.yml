name: Build & Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Deploy to live (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: playoff-creator

      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: playoff-creator

      # Functions are deployed only on push to main, not on PRs (which already
      # cover Hosting via the preview channel above). The service account in
      # FIREBASE_SERVICE_ACCOUNT must have Cloud Functions Developer +
      # Service Account User roles for this step to succeed.
      - name: Install Firebase CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # functions/ has its own package.json with its own tsc; without this
        # step, the firebase predeploy hook (`npm --prefix functions run
        # build`) falls back to a global tsc that fails with TS5011.
        run: npm ci --prefix functions

      - name: Deploy Cloud Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Soft-fail: the FIREBASE_SERVICE_ACCOUNT secret was provisioned for
        # Hosting deploys (Firebase Hosting Admin role only). To make this
        # step succeed, grant the service account these GCP roles in the
        # Console (IAM & Admin → IAM):
        #   - Cloud Functions Developer
        #   - Service Account User
        #   - Service Usage Consumer
        # Once those are granted, the step will go from yellow warning to
        # green and functions will redeploy on every push to main. Until
        # then, the step warns loudly but doesn't block the Hosting deploy
        # (which has its own narrower scope and works today).
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa-key.json"
          firebase deploy --only functions --project playoff-creator --force --non-interactive
          STATUS=$?
          rm -f "$RUNNER_TEMP/sa-key.json"
          if [ $STATUS -ne 0 ]; then
            echo "::warning::Cloud Functions deploy failed (exit $STATUS). If this is a permissions error, grant the service account Cloud Functions Developer + Service Account User + Service Usage Consumer roles. Hosting deploy is unaffected."
          fi
          exit $STATUS
